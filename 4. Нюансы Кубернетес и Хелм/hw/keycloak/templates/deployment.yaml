apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Avoid concurrent instances with independent local caches during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image | quote }}
          command: [sh, -ec]
          args:
            - |
              for attempt in $(seq 1 120); do
                if pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; then
                  exit 0
                fi
                sleep 2
              done
              echo 'PostgreSQL did not become ready in time' >&2
              exit 1
          env:
            - name: PGHOST
              value: {{ include "keycloak.name" . }}-postgresql
            - name: PGUSER
              value: {{ .Values.postgresql.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.database | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ ternary "start-dev" "start" (eq .Values.mode "development") }}
          envFrom:
            - configMapRef:
                name: {{ include "keycloak.name" . }}-config
          env:
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.credentials" . }}
                  key: admin-password
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.credentials" . }}
                  key: database-password
          ports:
            - name: web
              containerPort: {{ ternary 8443 8080 .Values.tls.enabled }}
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /opt/keycloak/conf/tls
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "keycloak.tls" . }}
            defaultMode: 0440
      {{- end }}
