apiVersion: v1
kind: Pod
metadata:
  name: {{ include "keycloak.name" . }}-test-oidc
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 90
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: oidc
      image: {{ .Values.test.image | quote }}
      command: [sh, -ec]
      args:
        - |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --max-time 10 \
            {{ if .Values.tls.enabled }}--cacert /tls/tls.crt{{ end }} \
            {{ printf "%s://%s:%d/realms/master/.well-known/openid-configuration" (ternary "https" "http" .Values.tls.enabled) (include "keycloak.name" .) (ternary 8443 8080 .Values.tls.enabled) | quote }} \
            --output /tmp/discovery.json
          grep -Fq '"issuer":"{{ .Values.hostname }}/realms/master"' /tmp/discovery.json
          echo 'PASS: OIDC discovery contains the expected issuer; TLS verified when enabled.'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      {{- if .Values.tls.enabled }}
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      {{- end }}
  {{- if .Values.tls.enabled }}
  volumes:
    - name: tls
      secret:
        secretName: {{ include "keycloak.tls" . }}
        items:
          - key: tls.crt
            path: tls.crt
  {{- end }}
