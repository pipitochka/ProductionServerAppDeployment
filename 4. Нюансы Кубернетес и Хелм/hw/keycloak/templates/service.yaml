apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: {{ ternary "https" "http" .Values.tls.enabled }}
      port: {{ ternary 8443 8080 .Values.tls.enabled }}
      targetPort: web
