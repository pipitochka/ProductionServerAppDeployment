apiVersion: v1
kind: Pod
metadata:
  name: durable-pod-2
  namespace: k8s-lab
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: persistent-data
          mountPath: /mnt/data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: app-storage-claim