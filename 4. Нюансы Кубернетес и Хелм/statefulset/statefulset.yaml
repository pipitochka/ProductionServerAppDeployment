apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-set
  namespace: k8s-lab
spec:
  serviceName: stateful-service
  replicas: 5
  selector:
    matchLabels:
      app: stateful-demo
  template:
    metadata:
      labels:
        app: stateful-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data-disk
              mountPath: /var/data
  volumeClaimTemplates:
    - metadata:
        name: data-disk
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi