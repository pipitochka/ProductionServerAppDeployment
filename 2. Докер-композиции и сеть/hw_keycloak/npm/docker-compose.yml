services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./certs:/etc/nginx/certs:ro
    networks:
      - npm-network

networks:
  npm-network:
    external: true
    name: ${NPM_NETWORK_NAME:-keycloak-npm}
